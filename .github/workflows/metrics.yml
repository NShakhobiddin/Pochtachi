name: O'lchovni yoqish (Cloudflare Worker)

# Terminalsiz o'rnatish: GitHub → Actions → shu workflow → "Run workflow".
# Kerak bo'ladigan sirlar (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — Cloudflare'da "Edit Cloudflare Workers" shablonidan
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare → Workers & Pages → o'ng ustunda Account ID
#   METRICS_READ_TOKEN    — o'zingiz o'ylab topgan uzun parol (hisobotni o'qish uchun)
#   ANTHROPIC_API_KEY     — ixtiyoriy: Pochtam AI uchun Claude API kaliti (console.anthropic.com)
#   GEMINI_API_KEY        — ixtiyoriy: Gemini zaxirasi (aistudio.google.com, pullik tarif) —
#                           Claude ishlamasa (chegara, yuklama) AI Gemini'da davom etadi
#   PARTNER_KEYS          — ixtiyoriy: hamkor kuryer kalitlari "d2d:pk_…,globbing:pk_…"
#                           (worker/hamkor-kalit.mjs yaratadi; docs/hamkor-api.md)
#   TELEGRAM_BOT_TOKEN    — ixtiyoriy: Telegram bot kaliti (@BotFather → /newbot). Bo'lsa
#                           bot shu Worker'ga ulanadi (webhook /tg), buyruqlar va
#                           "Pochtam" menyu tugmasi (Mini App — sayt Telegram ichida)
# Nima qiladi: worker/ ni Cloudflare'ga joylaydi, READ_TOKEN sirini o'rnatadi,
# chiqqan manzilni ilovadagi METRICS_URL ga yozadi, index.html ni qayta quradi
# va commit qilib push qiladi — shundan keyin sayt sanoqni yubora boshlaydi.

on:
  workflow_dispatch:
    inputs:
      eval:
        description: "AI sifat sinovi (tests/ai-eval.json, 23 savol, ~$0.5–1)"
        type: boolean
        default: false
      gemini_eval:
        description: "Gemini sifat sinovi: xuddi shu eval Gemini'da (GEMINI_API_KEY kerak)"
        type: boolean
        default: false
      compare:
        description: "Modellarni solishtirish: Sonnet 5, Sonnet 5.5, Sonnet 5.5 between_tools (har biri eval + oqim, jami ~$2–3)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Sirlar borligini tekshirish
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R: ${{ secrets.METRICS_READ_TOKEN }}
        run: |
          [ -n "$T" ] || { echo "::error::CLOUDFLARE_API_TOKEN siri yo'q"; exit 1; }
          [ -n "$A" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID siri yo'q"; exit 1; }
          [ -n "$R" ] || { echo "::error::METRICS_READ_TOKEN siri yo'q"; exit 1; }

      - name: Worker bog'liqliklari
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Worker testlari
        working-directory: worker
        run: npm test

      - name: Cloudflare'ga joylash
        id: deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # O'z domen ulangan bo'lsa (ildizdagi CNAME fayli) u ham ruxsat
          # etilgan manzillar ro'yxatiga qo'shiladi; GitHub Pages manzili qoladi.
          ORIGINS="https://nshakhobiddin.github.io"
          if [ -s ../CNAME ]; then ORIGINS="$ORIGINS,https://$(tr -d '[:space:]' < ../CNAME)"; fi
          echo "Ruxsat etilgan manzillar: $ORIGINS"
          npx wrangler deploy --var "ALLOW_ORIGIN:$ORIGINS" 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$URL" ] || { echo "::error::Worker manzili topilmadi — deploy.log ni ko'ring"; exit 1; }
          echo "url=$URL/" >> "$GITHUB_OUTPUT"
          echo "Worker manzili: $URL/"

      - name: Hisobot parolini o'rnatish (READ_TOKEN)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R: ${{ secrets.METRICS_READ_TOKEN }}
        run: printf '%s' "$R" | npx wrangler secret put READ_TOKEN

      # Kalitni Worker'ga yozishdan OLDIN Anthropic'ning o'zidan so'raymiz:
      # ishlaydimi va qaysi modellar mavjud. Kalit modelga bog'liq emas —
      # bitta kalit hisobdagi hamma modelni ochadi — shuning uchun bu ro'yxat
      # "qaysi modelni yozsam bo'ladi" degan savolga ham javob beradi.
      # Kalitning o'zi hech qayerga chiqmaydi: faqat uzunligi va model nomlari.
      - name: Kalitni tekshirish va mavjud modellarni ko'rsatish
        env:
          K: ${{ secrets.ANTHROPIC_API_KEY }}
          G: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          K=$(printf '%s' "$K" | tr -d '[:space:]')
          if [ -z "$K" ]; then echo "Kalit yo'q — tekshiruv o'tkazib yuborildi"; exit 0; fi
          echo "Kalit uzunligi: ${#K} belgi (to'liq kalit odatda 100 dan ortiq)"
          # Kalit TURI: faqat tasnif chiqadi, kalitning o'zi emas. Noto'g'ri
          # turdagi kalit (admin kaliti, OAuth tokeni, boshqa xizmatniki) ham
          # 401 beradi va uzunligi to'g'ri bo'lishi mumkin.
          case "$K" in
            sk-ant-api*)   echo "Kalit turi: API kaliti — tur to'g'ri";;
            sk-ant-admin*) echo "::error::Bu ADMIN kaliti (sk-ant-admin…). U faqat tashkilotni boshqarish uchun; Messages API ishlamaydi. API keys bo'limidan oddiy kalit oling.";;
            sk-ant-*)      echo "::warning::sk-ant- bilan boshlanadi, lekin api/admin emas — kalit turi notanish";;
            sk-*)          echo "::warning::sk- bilan boshlanadi, lekin Anthropic kalitiga o'xshamaydi (Anthropic: sk-ant-api…)";;
            *)             echo "::error::Anthropic API kaliti sk-ant-api… bilan boshlanadi. Sizniki boshqacha — bu boshqa xizmatning kaliti yoki OAuth tokeni bo'lishi mumkin.";;
          esac
          code=$(curl -s -o /tmp/models -w '%{http_code}' 'https://api.anthropic.com/v1/models?limit=100' \
            -H "x-api-key: $K" -H 'anthropic-version: 2023-06-01')
          if [ "$code" != "200" ]; then
            echo "::error::Anthropic kalitni qabul qilmadi ($code): $(head -c 400 /tmp/models)"
            echo "::error::401/403 — kalit noto'g'ri, chala nusxalangan yoki o'chirilgan. console.anthropic.com → API keys → Create key, so'ng GitHub sirini almashtiring."
            exit 1
          fi
          echo "Kalit ishlayapti. Shu kalitga ochiq modellar:"
          node -e "JSON.parse(require('fs').readFileSync('/tmp/models','utf8')).data.forEach(m=>console.log('  -', m.id))"
          CHAT=$(grep -oE '^AI_MODEL *= *"[^"]+"' worker/wrangler.toml | grep -oE '"[^"]+"' | tr -d '"')
          SHOT=$(grep -oE '^AI_SHOT_MODEL *= *"[^"]+"' worker/wrangler.toml | grep -oE '"[^"]+"' | tr -d '"')
          bad=0
          for M in "$CHAT" "$SHOT"; do
            # Ro'yxat ba'zi modellarni sanali nom bilan beradi
            # (claude-haiku-4-5 → claude-haiku-4-5-20251001). Taxallus ham,
            # sanali nom ham to'g'ri hisoblanadi.
            if grep -qE "\"$M(-[0-9]{8})?\"" /tmp/models; then
              echo "OK — $M mavjud"
            else
              echo "::error::wrangler.toml da yozilgan $M shu kalitga ochiq emas. Yuqoridagi ro'yxatdan birini tanlang."
              bad=1
            fi
          done
          [ "$bad" = "0" ] || exit 1
          # Kalit to'g'ri bo'lsa ham so'rov rad etilishi mumkin (hisobda
          # kredit tugagan, cheklov). 1 tokenli arzon so'rov — xato turi va
          # matni chiqadi (kalitning o'zi emas).
          code=$(curl -s -o /tmp/msg -w '%{http_code}' https://api.anthropic.com/v1/messages \
            -H "x-api-key: $K" -H 'anthropic-version: 2023-06-01' -H 'content-type: application/json' \
            -d '{"model":"claude-haiku-4-5","max_tokens":1,"messages":[{"role":"user","content":"ok"}]}')
          if [ "$code" = "200" ]; then
            echo "Sinov so'rovi: 200 — hisob ishlayapti"
          else
            MSG=$(node -e "try{const j=JSON.parse(require('fs').readFileSync('/tmp/msg','utf8'));const e=j.error||{};process.stdout.write(String(e.type||'')+': '+String(e.message||'').slice(0,240))}catch(e){process.stdout.write('?')}")
            echo "::error::Anthropic so'rovni rad etdi ($code): $MSG"
            case "$MSG" in
              *"usage limit"*) echo "::error::Hisobda o'zingiz qo'ygan oylik sarf chegarasiga yetildi. console.anthropic.com → Settings → Limits → chegarani oshiring (yoki ko'rsatilgan sanani kuting), keyin workflow'ni qayta ishga tushiring.";;
              *credit*|*billing*) echo "::error::Anthropic hisobida kredit tugagan. console.anthropic.com → Settings → Billing → kredit qo'shing, keyin workflow'ni qayta ishga tushiring.";;
            esac
            # Gemini zaxirasi bo'lsa — joylash davom etadi: AI shu kunlarda
            # Gemini'da ishlaydi (keyingi qadam kalitni o'rnatadi).
            G=$(printf '%s' "$G" | tr -d '[:space:]')
            case "$MSG" in *"usage limit"*|*credit*|*billing*)
              if [ -n "$G" ]; then echo "::warning::Claude hozir ishlamaydi — AI Gemini zaxirasida davom etadi. Claude'ni qaytarish uchun yuqoridagi sababni tuzating."; exit 0; fi;;
            esac
            exit 1
          fi

      - name: Pochtam AI kalitini o'rnatish (ANTHROPIC_API_KEY, ixtiyoriy)
        id: aikey
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          K: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # GitHub'da ANTHROPIC_API_KEY siri bo'lsa Worker'ga sir sifatida
          # yoziladi va /ai ishga tushadi; bo'lmasa /ai 503 qaytaradi, ilova
          # "AI vaqtincha mavjud emas" deb ko'rsatadi — qolgani ishlaydi.
          # Sirning O'ZI hech qayerga chiqmaydi — faqat bor/yo'q bayrog'i.
          # Nusxalashda kalit yoniga tushib qolgan bo'shliq yoki qator oxiri
          # Anthropic'da 401 beradi — kesib tashlaymiz. Kalit ichida bo'shliq
          # bo'lmaydi, shuning uchun bu xavfsiz.
          K=$(printf '%s' "$K" | tr -d '[:space:]')
          if [ -n "$K" ]; then
            printf '%s' "$K" | npx wrangler secret put ANTHROPIC_API_KEY
            echo "set=1" >> "$GITHUB_OUTPUT"
            echo "AI kaliti o'rnatildi"
          else
            echo "set=0" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY siri yo'q — AI o'chiq qoladi"
          fi

      - name: Gemini zaxira kalitini o'rnatish (GEMINI_API_KEY, ixtiyoriy)
        id: gemkey
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          G: ${{ secrets.GEMINI_API_KEY }}
          GM: ${{ vars.GEMINI_MODEL }}
        run: |
          set +e
          # Kalitning O'ZI hech qayerga chiqmaydi — faqat uzunligi va model nomlari.
          G=$(printf '%s' "$G" | tr -d '[:space:]')
          if [ -z "$G" ]; then echo "set=0" >> "$GITHUB_OUTPUT"; echo "GEMINI_API_KEY siri yo'q — Gemini zaxirasi o'chiq"; exit 0; fi
          echo "Gemini kaliti uzunligi: ${#G} belgi"
          code=$(curl -s -o /tmp/gm -w '%{http_code}' 'https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000' -H "x-goog-api-key: $G")
          if [ "$code" != "200" ]; then
            echo "::warning::Google Gemini kalitni qabul qilmadi ($code): $(head -c 300 /tmp/gm). aistudio.google.com → Get API key — yangi kalit olib, GitHub sirini almashtiring. Zaxira o'chiq qoladi."
            echo "set=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Matn yozadigan Flash modellar (rasm/ovoz/jonli variantlarsiz).
          # Nomzodlar: repo o'zgaruvchisi GEMINI_MODEL (Settings → Variables,
          # bitta yoki "a,b") bo'lsa — o'sha; bo'lmasa barqaror (preview emas)
          # Flash'lar, yangisidan eskisiga. Eng yangisi ko'pincha band
          # ("high demand", 503) — shuning uchun har biriga 1 so'zli sinov
          # so'rovi, javob berganlari oldinga; Worker'ga ko'pi bilan 3 tasi
          # ro'yxat bo'lib yoziladi (biri band bo'lsa keyingisi).
          CANDS=$(GM="$GM" node -e '(() => {
            const j = JSON.parse(require("fs").readFileSync("/tmp/gm", "utf8"));
            const ok = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent")).map(m => String(m.name || "").replace(/^models\//, ""));
            const txt = ok.filter(n => /^gemini-/.test(n) && /(flash|pro)/.test(n) && !/(image|tts|audio|live|embedding|computer|robotics|native)/.test(n));
            console.error("Gemini modellari: " + txt.join(", "));
            const want = String(process.env.GM || "").split(",").map(x => x.trim()).filter(x => ok.includes(x));
            if (want.length) { console.log(want.join(" ")); return; }
            const ver = n => parseFloat((/^gemini-([0-9.]+)/.exec(n) || [0, 0])[1]) || 0;
            const stable = txt.filter(n => /^gemini-[0-9.]+-flash$/.test(n)).sort((a, b) => ver(b) - ver(a));
            const extra = ok.includes("gemini-flash-latest") ? ["gemini-flash-latest"] : [];
            console.log(stable.slice(0, 5).concat(extra).join(" "));
          })()')
          if [ -z "$CANDS" ]; then echo "::warning::Kalitga mos Gemini Flash modeli topilmadi — zaxira o'chiq qoladi"; echo "set=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          GOOD=""; BUSY=""; LASTERR=""
          for M in $CANDS; do
            code=$(curl -s -m 30 -o /tmp/gt -w '%{http_code}' "https://generativelanguage.googleapis.com/v1beta/models/$M:generateContent" \
              -H "x-goog-api-key: $G" -H 'content-type: application/json' -d '{"contents":[{"role":"user","parts":[{"text":"ok"}]}],"generationConfig":{"maxOutputTokens":8}}')
            if [ "$code" = "200" ]; then GOOD="$GOOD $M"; echo "OK — $M javob berdi"
            else BUSY="$BUSY $M"; LASTERR=$(node -e "try{const j=JSON.parse(require('fs').readFileSync('/tmp/gt','utf8'));const e=(Array.isArray(j)?j[0]:j).error||{};process.stdout.write(String(e.status||'')+': '+String(e.message||'').slice(0,160))}catch(e){process.stdout.write('?')}"); echo "$M — $code $LASTERR"; fi
          done
          PICK=$(echo $GOOD $BUSY | tr ' ' '\n' | grep -v '^$' | head -3 | paste -sd, -)
          [ -n "$GOOD" ] || echo "::warning::Hech bir Gemini modeli hozir javob bermadi ($LASTERR). Ro'yxat baribir yoziladi — band holat odatda vaqtinchalik; billing yoqilganini tekshiring."
          code=$([ -n "$GOOD" ] && echo 200 || echo "$code")
          # Diagnostika: namuna skrinshot har bir modelga (Worker'ning aynan
          # o'sha so'rovi) — narx o'qildimi, vaqt, xato matni.
          echo "== Gemini skrinshot sinovi (media/shot-sample.webp, kutilgan narx 699 CNY)"
          GEMINI_API_KEY="$G" node gemini-probe.mjs "$(echo $CANDS | tr ' ' ',')" | tee /tmp/probe.txt
          echo "::notice::Gemini skrinshot: $(tr '\n' ' ' < /tmp/probe.txt | cut -c1-900)"
          printf '%s' "$G" | npx wrangler secret put GEMINI_API_KEY
          printf '%s' "$PICK" | npx wrangler secret put GEMINI_MODEL
          echo "set=1" >> "$GITHUB_OUTPUT"
          [ -n "$GOOD" ] || GOOD=" hech biri (hozir band)"
          echo "::notice::Gemini zaxirasi yoqildi — modellar (tartib bilan): $PICK; javob berganlar:$GOOD"

      - name: Hamkor kuryer kalitlarini o'rnatish (PARTNER_KEYS, ixtiyoriy)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          P: ${{ secrets.PARTNER_KEYS }}
        run: |
          # Kalitlar hech qayerga chiqmaydi — faqat kuryer id'lari (ular ochiq:
          # ilova /ai/status dan oladi).
          P=$(printf '%s' "$P" | tr -d '[:space:]')
          if [ -n "$P" ]; then
            printf '%s' "$P" | npx wrangler secret put PARTNER_KEYS
            echo "Hamkor kuryerlar: $(printf '%s' "$P" | tr ',' '\n' | cut -d: -f1 | tr '\n' ' ')"
          else
            echo "PARTNER_KEYS siri yo'q — hamkor kuryer hali yo'q; holat API ishlaydi, faqat egasi (READ_TOKEN) yoza oladi"
          fi

      # Telegram bot: kalit Worker siriga yoziladi, webhook shu Worker'ning /tg
      # manziliga ulanadi. Webhook siri kalitdan hosil qilinadi (worker/src/tg.js
      # dagi tgSecret bilan bir xil) — alohida sir kerak emas. Kalit logga
      # chiqmaydi: faqat bot nomi (@username) va webhook holati.
      - name: Telegram botini ulash (TELEGRAM_BOT_TOKEN, ixtiyoriy)
        id: tgbot
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          T=$(printf '%s' "$T" | tr -d '[:space:]')
          if [ -z "$T" ]; then echo "set=0" >> "$GITHUB_OUTPUT"; echo "TELEGRAM_BOT_TOKEN siri yo'q — Telegram bot o'chiq"; exit 0; fi
          API="https://api.telegram.org/bot$T"
          ME=$(curl -s "$API/getMe")
          if ! printf '%s' "$ME" | grep -q '"ok":true'; then
            echo "::error::Telegram bot kaliti ishlamadi (getMe): $(printf '%s' "$ME" | grep -o '"description":"[^"]*"')"; exit 1
          fi
          BOT=$(printf '%s' "$ME" | grep -o '"username":"[^"]*"' | cut -d'"' -f4)
          printf '%s' "$T" | npx wrangler secret put TELEGRAM_BOT_TOKEN
          SEC=$(printf '%s' "pochtam-tg-webhook:$T" | sha256sum | cut -c1-48)
          APP="https://nshakhobiddin.github.io/Pochtachi/"
          if [ -s ../CNAME ]; then APP="https://$(tr -d '[:space:]' < ../CNAME)/"; fi
          sleep 3
          R1=$(curl -s "$API/setWebhook" -H 'content-type: application/json' \
            -d "{\"url\":\"${URL}tg\",\"secret_token\":\"$SEC\",\"allowed_updates\":[\"message\"],\"max_connections\":20}")
          printf '%s' "$R1" | grep -q '"ok":true' || { echo "::error::setWebhook: $(printf '%s' "$R1" | grep -o '"description":"[^"]*"')"; exit 1; }
          curl -s "$API/setMyCommands" -H 'content-type: application/json' \
            -d '{"commands":[{"command":"start","description":"Boshlash va yo‘riqnoma"},{"command":"kurs","description":"Markaziy bank dollar kursi"},{"command":"help","description":"Qanday ishlaydi"}]}' > /dev/null
          curl -s "$API/setMyCommands" -H 'content-type: application/json' \
            -d '{"language_code":"ru","commands":[{"command":"start","description":"Начать и инструкция"},{"command":"kurs","description":"Курс доллара ЦБ"},{"command":"help","description":"Как это работает"}]}' > /dev/null
          curl -s "$API/setChatMenuButton" -H 'content-type: application/json' \
            -d "{\"menu_button\":{\"type\":\"web_app\",\"text\":\"Pochtam\",\"web_app\":{\"url\":\"$APP\"}}}" > /dev/null
          curl -s "$API/setMyShortDescription" -H 'content-type: application/json' \
            -d '{"short_description":"Chet eldan xarid: skrinshot yuboring — kuryer, boj va jami narx."}' > /dev/null
          curl -s "$API/setMyDescription" -H 'content-type: application/json' \
            -d '{"description":"Do‘kon ilovasidan tovar skrinshotini yuboring — Pochtam narxni o‘qiydi va tavsiya etilgan kuryer, boj, yig‘im bilan jami summani so‘mda hisoblaydi. Savol ham yozishingiz mumkin. To‘liq ilova — Pochtam tugmasida."}' > /dev/null
          INFO=$(curl -s "$API/getWebhookInfo")
          echo "set=1" >> "$GITHUB_OUTPUT"
          echo "::notice::Telegram bot ulandi — @$BOT · webhook ${URL}tg · Mini App $APP · navbatda $(printf '%s' "$INFO" | grep -o '"pending_update_count":[0-9]*' | cut -d: -f2) ta $(printf '%s' "$INFO" | grep -o '"last_error_message":"[^"]*"')"

      - name: Serverni sinash
        env:
          URL: ${{ steps.deploy.outputs.url }}
          R: ${{ secrets.METRICS_READ_TOKEN }}
        run: |
          sleep 5
          set +e
          echo "== GET /"
          code=$(curl -s -o /tmp/r1 -w '%{http_code}' "$URL"); echo "[$code] $(cat /tmp/r1)"
          [ "$code" = "200" ] || { echo "::error::Server ochilmadi (GET / -> $code)"; exit 1; }
          echo "== POST / (sinov beacon)"
          code=$(curl -s -o /tmp/r2 -w '%{http_code}' -X POST "$URL" -H 'origin: https://nshakhobiddin.github.io' -H 'content-type: text/plain' \
            -d '{"v":"ci","l":"uz","e":[{"n":"screen","k":"ci"}]}'); echo "[$code] $(cat /tmp/r2)"
          [ "$code" = "204" ] || { echo "::error::Beacon qabul qilinmadi (POST / -> $code)"; exit 1; }
          echo "== GET /stats"
          ok=0
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/r3 -w '%{http_code}' -H "authorization: Bearer $R" "${URL}stats?days=1")
            echo "[$code] $(head -c 400 /tmp/r3)"
            if [ "$code" = "200" ] && grep -q '"screen"' /tmp/r3; then ok=1; break; fi
            sleep 3
          done
          [ "$ok" = "1" ] || { echo "::error::Hisobot o'qilmadi (GET /stats -> $code). Parol (METRICS_READ_TOKEN) to'g'rimi?"; exit 1; }
          echo "Server javob beryapti."
          # Telegram webhook: sirsiz so'rov rad etiladi (bot ulangan bo'lsa 403, yo'q bo'lsa 404).
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${URL}tg" -d '{"update_id":1}')
          echo "== POST /tg (sirsiz) [$code]"
          case "$code" in 403|404) ;; *) echo "::error::/tg sirsiz so'rovni qabul qildi ($code)"; exit 1;; esac
          # Hamkor holat API: kalitsiz — 401; egasi "sinov" kuryeri nomidan
          # yozadi, ilova yo'li (POST /track, o'z Origin) o'qiydi.
          echo "== POST /partner/status (kalitsiz)"
          code=$(curl -s -o /tmp/p0 -w '%{http_code}' -X POST "${URL}partner/status" -d '{"number":"CI-000000","status":"shipped"}'); echo "[$code] $(cat /tmp/p0)"
          [ "$code" = "401" ] || { echo "::error::Kalitsiz yozuv 401 bo'lishi kerak edi ($code)"; exit 1; }
          N="CI-${GITHUB_RUN_ID}"
          echo "== POST /partner/status (egasi, sinov kuryeri)"
          code=$(curl -s -o /tmp/p1 -w '%{http_code}' -X POST "${URL}partner/status" -H "authorization: Bearer $R" -H 'content-type: application/json' \
            -d "{\"courier\":\"sinov\",\"events\":[{\"number\":\"$N\",\"status\":\"shipped\"},{\"number\":\"$N\",\"status\":\"ready\",\"note\":\"workflow\"}]}")
          echo "[$code] $(cat /tmp/p1)"
          [ "$code" = "200" ] || { echo "::error::Holat yozilmadi (POST /partner/status -> $code)"; exit 1; }
          echo "== POST /track"
          code=$(curl -s -o /tmp/p2 -w '%{http_code}' -X POST "${URL}track" -H 'origin: https://nshakhobiddin.github.io' -H 'content-type: text/plain' \
            -d "{\"q\":[{\"c\":\"sinov\",\"n\":\"$N\"}]}")
          echo "[$code] $(head -c 400 /tmp/p2)"
          ST=$(node -e "try{const j=JSON.parse(require('fs').readFileSync('/tmp/p2','utf8'));const r=j.r[0];process.stdout.write(r.found?r.st+' tarix='+r.h.length:'topilmadi')}catch(e){process.stdout.write('xato')}")
          case "$ST" in ready*) echo "::notice::Hamkor holat API ishlayapti — yozildi va o'qildi: $ST";; *) echo "::error::/track kutilgan holatni bermadi: $ST"; exit 1;; esac
          echo "== GET /ai/status (partners)"
          curl -s "${URL}ai/status" | tee /tmp/p3; echo
          grep -q '"partners"' /tmp/p3 || { echo "::error::/ai/status da partners maydoni yo'q"; exit 1; }

      - name: Pochtam AI sinovi (/ai — savol, skrinshot, veb-qidiruv, joriy xarid)
        env:
          URL: ${{ steps.deploy.outputs.url }}
          KEY_SET: ${{ steps.aikey.outputs.set }}
        run: |
          set +e
          # Kalit bo'lmasa 503 no_key — bu xato emas, AI o'chiq degani; workflow davom etadi.
          # Kalit QO'YILGAN bo'lsa esa 200 dan boshqa javob — haqiqiy xato:
          # aks holda buzuq kalit yashil belgi ostida ko'rinmay qolardi.
          echo "== POST /ai"
          code=$(curl -s -m 90 -o /tmp/ai1 -w '%{http_code}' -X POST "${URL}ai" -H 'origin: https://nshakhobiddin.github.io' -H 'content-type: text/plain' \
            -d '{"q":"320 dollarlik 2.5 kg tovar uchun boj qancha?","lang":"uz","usdRate":12650}')
          echo "[$code] $(head -c 700 /tmp/ai1)"
          echo "== POST /ai (faqat rasm: 1x1 PNG — narx topilmasligi kutiladi, yo'l va stop:shot tekshiriladi)"
          code2=$(curl -s -m 90 -o /tmp/ai2 -w '%{http_code}' -X POST "${URL}ai" -H 'origin: https://nshakhobiddin.github.io' -H 'content-type: text/plain' \
            -d '{"image":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==","lang":"uz","usdRate":12650}')
          echo "[$code2] $(head -c 400 /tmp/ai2)"
          MODEL=$(node -e "try{process.stdout.write(JSON.parse(require('fs').readFileSync('/tmp/ai1','utf8')).model||'')}catch(e){}")
          # Diqqat: ${MODEL:-...} ichiga apostrofli so'z yozib bo'lmaydi —
          # bash uni ochilgan qo'shtirnoq deb o'qiydi va skript yiqiladi.
          [ -n "$MODEL" ] || MODEL='?'
          if [ "$KEY_SET" = "1" ]; then
            # Kalit bor: ikkala yo'l ham ishlashi shart.
            if [ "$code" != "200" ]; then
              echo "::error::Kalit qo'yilgan, lekin /ai $code qaytardi — $(head -c 300 /tmp/ai1)"
              grep -q '"code":"key"' /tmp/ai1 && echo "::error::Anthropic kalitni rad etdi (401/403). Kalit to'liq nusxalanganini va o'chirilmaganini tekshiring: console.anthropic.com → API keys. Yangi kalit olib, GitHub sirini almashtiring."
              grep -q '"code":"no_key"' /tmp/ai1 && echo "::error::Worker'da kalit yo'q — sir o'rnatilmadi."
              exit 1
            fi
            [ "$code2" = "200" ] || { echo "::error::Kalit qo'yilgan, lekin /ai (rasm) $code2 qaytardi — $(head -c 300 /tmp/ai2)"; exit 1; }
            grep -q '"stop":"shot"' /tmp/ai2 || { echo "::error::Faqat rasmli so'rovda asosiy model chaqirilmasligi kerak edi (stop:shot yo'q) — $(head -c 300 /tmp/ai2)"; exit 1; }
            echo "::notice::Pochtam AI ishlayapti — /ai savol 200, /ai rasm 200 (stop:shot), model: $MODEL"
            # Oqim (stream: true): birinchi so'z qancha soniyada chiqdi va
            # butun javob qancha — ilovadagi "tezroq javob" shu.
            echo "== POST /ai (stream: true)"
            STREAM=$(URL="$URL" node -e '
              const t0 = Date.now(); let first = 0, texts = 0, last = null, statuses = [];
              (async () => {
                const r = await fetch(process.env.URL + "ai", { method: "POST", headers: { origin: "https://nshakhobiddin.github.io", "content-type": "text/plain" },
                  body: JSON.stringify({ q: "Xitoydan 1 kg krossovka olib kelsam boj tushadimi?", lang: "uz", usdRate: 12650, stream: true }) });
                const ct = r.headers.get("content-type") || "";
                if (!/ndjson/.test(ct)) { console.log("xato: content-type " + ct + " status " + r.status); return; }
                const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "";
                for (;;) { const { value, done } = await rd.read(); if (done) break; buf += dec.decode(value, { stream: true });
                  let i; while ((i = buf.indexOf("\n")) >= 0) { const l = buf.slice(0, i).trim(); buf = buf.slice(i + 1); if (!l) continue;
                    const e = JSON.parse(l); if (e.t === "text") { texts++; if (!first) first = Date.now(); } if (e.t === "status") statuses.push(e.s); last = e; } }
                const s = x => ((x - t0) / 1000).toFixed(1) + " s";
                console.log((last && last.t === "done" && last.text ? "ok" : "xato: oxirgi " + JSON.stringify(last).slice(0, 200)) + " | birinchi so`z " + (first ? s(first) : "—") + " | jami " + s(Date.now()) + " | bo`laklar " + texts + " | bosqichlar " + (statuses.join(",") || "—"));
              })().catch(e => console.log("xato: " + e.message));')
            echo "$STREAM"
            case "$STREAM" in ok*) echo "::notice::Oqim: $STREAM";; *) echo "::error::Oqimli /ai ishlamadi: $STREAM"; exit 1;; esac
            # "Qayerdan topaman" (find:true) — veb-qidiruv va aniq havolalar.
            # Natija internetga bog'liq, shuning uchun xato emas, faqat xabar:
            # nechta qidiruv bo'ldi va product_links keldimi. Narxi ≈ $0.05.
            echo "== POST /ai (find:true — veb-qidiruv)"
            code3=$(curl -s -m 120 -o /tmp/ai3 -w '%{http_code}' -X POST "${URL}ai" -H 'origin: https://nshakhobiddin.github.io' -H 'content-type: text/plain' \
              -d '{"q":"Poyabzal va krossovka qidiryapman (Nike Air Max 90, 42 razmer). Faqat original. Byudjet $150 gacha. Qaysi do'"'"'kondan topaman?","lang":"uz","usdRate":12650,"find":true}')
            echo "[$code3] $(head -c 500 /tmp/ai3)"
            FIND=$(node -e "try{const j=JSON.parse(require('fs').readFileSync('/tmp/ai3','utf8'));const pl=(j.cards||[]).find(c=>c.type==='links');process.stdout.write('qidiruvlar='+((j.usage&&j.usage.search)||0)+' havolalar='+(pl?pl.links.length:0)+(pl?' ('+pl.links.map(l=>l.host).join(', ')+')':'')+' kesh='+((j.usage&&j.usage.cacheRead)||0)+(j.usage&&j.usage.cached?' (tayyor javob — AI chaqirilmadi)':'')+' tashqi='+(((j.cards||[]).find(c=>c.type==='stores_ext')||{stores:[]}).stores.map(x=>x.host).join(',')||'yo\\'q'))}catch(e){}")
            [ -n "$FIND" ] || FIND='?'
            if [ "$code3" = "200" ]; then echo "::notice::Veb-qidiruv: $FIND"; else echo "::warning::find so'rovi $code3 qaytardi — $(head -c 200 /tmp/ai3)"; fi
            # Yagona kirish: joriy xarid (cart) bilan savol — AI qayta
            # so'ramasligi va kartalar qaytishi tekshiriladi.
            echo "== POST /ai (joriy xarid bilan)"
            code4=$(curl -s -m 90 -o /tmp/ai4 -w '%{http_code}' -X POST "${URL}ai" -H 'origin: https://nshakhobiddin.github.io' -H 'content-type: text/plain' \
              -d '{"q":"Shu tovarga boj tushadimi?","lang":"uz","usdRate":12650,"cart":{"name":"Nike Air Max 90","store":"Taobao","country":"Xitoy","price":699,"cur":"CNY","kg":0.8,"courier":"D2D","totalUsd":102.2}}')
            echo "[$code4] $(head -c 400 /tmp/ai4)"
            CARDS=$(node -e "try{const j=JSON.parse(require('fs').readFileSync('/tmp/ai4','utf8'));process.stdout.write('kartalar='+((j.cards||[]).map(c=>c.type).join(',')||'yo\'q')+' vositalar='+((j.tools||[]).join(',')||'yo\'q')+' kesh='+((j.usage&&j.usage.cacheRead)||0))}catch(e){}")
            [ -n "$CARDS" ] || CARDS='?'
            if [ "$code4" = "200" ]; then echo "::notice::Joriy xarid bilan: $CARDS"; else echo "::warning::cart so'rovi $code4 qaytardi — $(head -c 200 /tmp/ai4)"; fi
            # "Qidiruv so'zlari" (kw:true): arzon model har do'kon tilida so'z
            # beradi (xitoycha, turkcha, inglizcha). Kalit bor — 200 va
            # do'konlar ro'yxati shart. Narxi ≈ $0.001.
            echo "== POST /ai (kw:true — qidiruv so'zlari)"
            code5=$(curl -s -m 60 -o /tmp/ai5 -w '%{http_code}' -X POST "${URL}ai" -H 'origin: https://nshakhobiddin.github.io' -H 'content-type: text/plain' \
              -d '{"q":"termos 1 litr","kw":true,"who":"","style":"","lang":"uz"}')
            echo "[$code5] $(head -c 600 /tmp/ai5)"
            KW=$(node -e "try{const j=JSON.parse(require('fs').readFileSync('/tmp/ai5','utf8'));const k=j.kw||{};process.stdout.write((k.stores&&k.stores.length?'ok':'xato')+' | '+(k.name||'')+' | zh='+((k.words||{}).zh||'')+' tr='+((k.words||{}).tr||'')+' en='+((k.words||{}).en||'')+' | dokonlar='+((k.stores||[]).map(s=>s.id).join(','))+' | model='+(j.model||'')+' usd='+((j.usage&&j.usage.usd)||0))}catch(e){process.stdout.write('xato: '+e.message)}")
            echo "$KW"
            if [ "$code5" = "200" ]; then case "$KW" in ok*) echo "::notice::Qidiruv so'zlari: $KW";; *) echo "::error::kw javobida do'konlar yo'q: $KW"; exit 1;; esac; else echo "::error::kw so'rovi $code5 qaytardi — $(head -c 200 /tmp/ai5)"; exit 1; fi
          else
            case "$code" in
              503) grep -q no_key /tmp/ai1 \
                     && echo "::warning::AI o'chiq: ANTHROPIC_API_KEY siri yo'q (GitHub → Settings → Secrets and variables → Actions)" \
                     || echo "::warning::AI 503: Claude API javob bermadi — $(head -c 200 /tmp/ai1)";;
              *) echo "::warning::Kalitsiz kutilgani 503 edi, keldi: $code";;
            esac
          fi

      - name: AI sifat sinovi (ixtiyoriy — eval)
        if: ${{ inputs.eval && steps.aikey.outputs.set == '1' }}
        env:
          URL: ${{ steps.deploy.outputs.url }}
          R: ${{ secrets.METRICS_READ_TOKEN }}
        run: |
          # Har savolga haqiqiy javob (tayyor javob keshi va IP chegarasisiz).
          # Xulosa — ogohlantirish: sifat pasaygan savollar ro'yxati ko'rinadi.
          AI_URL="${URL}ai" AI_ORIGIN="https://nshakhobiddin.github.io" EVAL_TOKEN="$R" node tests/ai.mjs | tee /tmp/eval.log
          echo "::notice::AI sifat sinovi: $(tail -2 /tmp/eval.log | tr '\n' ' ')"

      - name: Gemini sifat sinovi (ixtiyoriy — gemini_eval)
        if: ${{ inputs.gemini_eval && steps.gemkey.outputs.set == '1' }}
        env:
          URL: ${{ steps.deploy.outputs.url }}
          R: ${{ secrets.METRICS_READ_TOKEN }}
        run: |
          # Xuddi shu savollar Gemini'da (x-pochtam-provider: gemini — faqat
          # eval paroli bilan ishlaydi). Natija Claude bilan solishtiriladi.
          AI_URL="${URL}ai" AI_ORIGIN="https://nshakhobiddin.github.io" EVAL_TOKEN="$R" EVAL_PROVIDER=gemini node tests/ai.mjs | tee /tmp/eval-g.log
          echo "::notice::Gemini sifat sinovi: $(tail -2 /tmp/eval-g.log | tr '\n' ' ')"

      - name: Modellarni solishtirish (ixtiyoriy — compare)
        if: ${{ inputs.compare && steps.aikey.outputs.set == '1' }}
        env:
          URL: ${{ steps.deploy.outputs.url }}
          R: ${{ secrets.METRICS_READ_TOKEN }}
        run: |
          # Bir xil savollar har sozlamada: o'tgan savollar, $/savol, vaqt.
          # Oqim (tests/ai-stream.mjs): birinchi so'z va yakuniy matn.
          # Sinov sarfi foydalanuvchilar byudjetiga qo'shilmaydi (ai_usd_eval).
          # Diqqat: ${X:-...} ichiga apostrofli so'z yozilmaydi (bash).
          set +e
          export AI_URL="${URL}ai" AI_ORIGIN="https://nshakhobiddin.github.io" EVAL_TOKEN="$R"
          for CFG in "claude-sonnet-5:" "claude-sonnet-5-5:" "claude-sonnet-5-5:between_tools"; do
            export EVAL_MODEL="${CFG%%:*}" EVAL_THINKING="${CFG#*:}"
            LABEL="$EVAL_MODEL ${EVAL_THINKING:-standart}"
            echo "================ $LABEL"
            node tests/ai.mjs > /tmp/cmp.log 2>&1
            grep -E 'XATO|OGOH' /tmp/cmp.log | cut -c1-400
            RES=$(grep '^NATIJA' /tmp/cmp.log | tail -1)
            [ -n "$RES" ] || RES="natija chiqmadi: $(tail -3 /tmp/cmp.log | tr '\n' ' ' | cut -c1-300)"
            STREAM=$(node tests/ai-stream.mjs 2>&1 | tail -1)
            echo "::notice::$LABEL — $RES | $STREAM"
          done
          true

      - name: Ilovaga manzilni yozish va qurish
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          F="Xarid Yordamchisi v2.dc.html"
          if grep -q "const METRICS_URL = '$URL'" "$F"; then echo "Manzil allaqachon yozilgan"; exit 0; fi
          node -e "
            const fs=require('fs'); const f=process.argv[1]; let s=fs.readFileSync(f,'utf8');
            s=s.replace(/const METRICS_URL = '[^']*';/, \"const METRICS_URL = '\" + process.env.URL + \"';\");
            fs.writeFileSync(f, s);" "$F"
          npm install --no-audit --no-fund
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "O'lchov yoqildi: METRICS_URL = $URL"
          git push origin HEAD:${{ github.ref_name }}
          echo "Ilova yangilandi. Hisobot sahifasi: ${URL}hisobot (paroli — METRICS_READ_TOKEN)"
