# Pochtam o'lchov serveri. O'rnatish: worker/README.md
name = "pochtam-metrics"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
# Faqat shu saytdan kelgan beacon qabul qilinadi (Origin sarlavhasi).
# Bir nechta bo'lsa vergul bilan: "https://a.uz,https://b.github.io".
# O'z domen ulanganda (CNAME fayli) workflow uni o'zi qo'shib joylaydi.
# Bo'sh qoldirilsa hamma joydan qabul qiladi — tavsiya etilmaydi.
ALLOW_ORIGIN = "https://nshakhobiddin.github.io"
# "1" bo'lsa GET /public tokensiz ochiladi (oxirgi 7 kunning eng ko'p
# ochilgan do'kon/kuryer/qo'llanmalari) — ilovadagi "tirik signal" uchun.
PUBLIC_STATS = "0"

# Pochtam AI (POST /ai). Kalit — sir:  wrangler secret put ANTHROPIC_API_KEY
# Kalit qo'yilmaguncha /ai 503 "AI vaqtincha mavjud emas" qaytaradi, ilova
# buni ko'rsatadi va qolgani ishlayveradi.
AI_MODEL = "claude-opus-5"
# Kunlik chegara: bitta IP (xesh) uchun va hammasi uchun. Xarajat nazorati.
AI_DAILY_PER_IP = "20"
AI_DAILY_TOTAL = "300"
# Javob uzunligi (token) va fikrlash darajasi (bo'sh — API standarti).
AI_MAX_TOKENS = "1024"
AI_EFFORT = "medium"

# READ_TOKEN — sir, toml ga yozilmaydi:  wrangler secret put READ_TOKEN

# Cloudflare panelida (Workers & Pages → pochtam-metrics → Logs) so'rovlar
# va xatolar ko'rinsin.
[observability]
enabled = true

[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter"]

# Har kuni 03:00 UTC da 90 kundan eski sanoq o'chiriladi.
[triggers]
crons = ["0 3 * * *"]
