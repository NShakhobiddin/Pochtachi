# Pochtam o'lchov serveri. O'rnatish: worker/README.md
name = "pochtam-metrics"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
# Faqat shu saytdan kelgan beacon qabul qilinadi (Origin sarlavhasi).
# Bir nechta bo'lsa vergul bilan: "https://a.uz,https://b.github.io".
# O'z domen ulanganda (CNAME fayli) workflow uni o'zi qo'shib joylaydi.
# Bo'sh qoldirilsa hamma joydan qabul qiladi — tavsiya etilmaydi.
ALLOW_ORIGIN = "https://nshakhobiddin.github.io"
# "1" bo'lsa GET /public tokensiz ochiladi (oxirgi 7 kunning eng ko'p
# ochilgan do'kon/kuryer/qo'llanmalari) — ilovadagi "tirik signal" uchun.
PUBLIC_STATS = "0"

# Pochtam AI (POST /ai). Kalit — sir:  wrangler secret put ANTHROPIC_API_KEY
# Kalit qo'yilmaguncha /ai 503 "AI vaqtincha mavjud emas" qaytaradi, ilova
# buni ko'rsatadi va qolgani ishlayveradi.
AI_MODEL = "claude-sonnet-5"
# Skrinshotdan narx o'qish (POST /ai ichida, rasm bo'lsa) — arzon model yetarli.
AI_SHOT_MODEL = "claude-haiku-4-5"
# Kunlik chegara: bitta IP (xesh) uchun va hammasi uchun. Xarajat nazorati.
AI_DAILY_PER_IP = "20"
AI_DAILY_TOTAL = "300"
# Kunlik xarajat chegarasi, $ (taxminiy, hisobotdagi "AI xarajati"): oshsa
# ertagacha AI javob bermaydi — oylik Anthropic chegarasiga urilmaslik uchun.
# Taxminan: chat savoli $0.01–0.03, skrinshot $0.002, "Qayerdan topaman" $0.03–0.05.
AI_DAILY_USD = "2"
# "Qayerdan topaman" (veb-qidiruv) bitta IP uchun kuniga; oshsa qidiruvsiz
# javob (do'konlar + qidiruv havolasi), rad etilmaydi.
AI_DAILY_FIND_PER_IP = "5"
# Bir xil savolga shu kuni tayyor javob (AI chaqirilmaydi): "0" — o'chiq.
AI_ANSWER_CACHE = "1"
# Ko'rsatma keshi muddati: "5m" (standart) yoki "1h" — hisobotda keshga
# yozish o'qishdan ko'p bo'lsa va soatiga 2+ savol bo'lsa "1h" arzonroq.
AI_CACHE_TTL = "5m"
# Javob uzunligi (token) va fikrlash darajasi (bo'sh — API standarti).
# Tezlik uchun oddiy savolga "low" (hisobni vositalar qiladi, model faqat
# yo'naltiradi); veb-qidiruv va havola o'qishda to'g'ri mahsulotni tanlash
# kerak — "medium". Ilova javobni oqim (stream) bilan oladi.
AI_MAX_TOKENS = "2048"
AI_EFFORT = "low"
AI_EFFORT_FIND = "medium"
# Fikrlash rejimi: bo'sh — API standarti (adaptiv). "between_tools" —
# oldindan fikrlashsiz (faqat Sonnet 5.5; effort high gacha) — tezroq va
# arzonroq, sifati sinov (workflow compare) bilan tanlanadi.
AI_THINKING = ""
# Havoladan narx: sahifa to'silsa yoki matndan narx chiqmasa asosiy model
# web_fetch bilan o'qishi (~$0.03, 10+ s). "0" — o'chiq (standart): jonli
# sinovda to'silgan saytlarda u ham o'tolmadi; ilova skrinshot so'raydi.
AI_LINK_FETCH = "0"
# Sifat sinovi (eval) uchun alohida kunlik chegara, $ — foydalanuvchilar
# byudjetiga (AI_DAILY_USD) qo'shilmaydi.
AI_EVAL_DAILY_USD = "5"
# "Qayerdan topaman" so'rovlarida veb-qidiruv (aniq mahsulot havolalari):
# "0" — o'chiq. Har qidiruv $0.01, bitta so'rovda ko'pi bilan AI_WEB_SEARCH_USES ta.
AI_WEB_SEARCH = "1"
AI_WEB_SEARCH_USES = "1"

# READ_TOKEN — sir, toml ga yozilmaydi:  wrangler secret put READ_TOKEN

# Cloudflare panelida (Workers & Pages → pochtam-metrics → Logs) so'rovlar
# va xatolar ko'rinsin.
[observability]
enabled = true

[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter"]

# Hamkor kuryerlar yuborgan jo'natma holatlari (src/track.js). Kalitlar —
# sir, toml ga yozilmaydi:  wrangler secret put PARTNER_KEYS  ("d2d:kalit,…")
[[durable_objects.bindings]]
name = "TRACKS"
class_name = "Tracks"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Tracks"]

# Har kuni 03:00 UTC da 90 kundan eski sanoq o'chiriladi.
[triggers]
crons = ["0 3 * * *"]
